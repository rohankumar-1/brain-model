# Ablation baseline: the pooled-only recipe on the same code. Every crop is pooled and pulled toward the
# global mean (the 2D objective); no dense term, no nesting, no fine crops, no degradations.
# Compare against brainmodel_tiny_lejepa.yaml with downstream/probe3d.py.

seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  default_spacing_mm: [1.0, 1.0, 1.0]
  default_origin_mm: [0.0, 0.0, 0.0]
  volume_size_xyz: [256, 256, 128]
  num_workers: 10
model: {size: tiny, in_chans: 1, proj_dim: 128, proj_hidden: 2048, qk_norm: true,
  rope_base_mm: 100.0, checkpoint: true, proj_norm: batch, length_buckets: 4, dense_dim: 128,
  dense_hidden: 512}
views:
  patch_xyz: [16, 16, 8]
  global:
    n: 2
    size_xyz: [128, 128, 64]
  local:
    n: 4
    size_xyz: [64, 64, 32]
  fine:
    n: 0
    size_xyz: [32, 32, 16]
    patch_xyz: [8, 8, 4]
  nested: false
  fg_min: 0.15
  retries: 8
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
aug:
  window: {mode: random, mix: brain}
  noise: {p: 0.0}
  blur: {p: 0.0}
  drift: {p: 0.0}
loss:
  lamb: 0.02
  win_weight: 1.0
  local_pooled: true
  n_proj: 256
  gather_ddp: true
  dense: {weight: 0.0, tokens_per_view: 4}
optim: {lr: 0.0005, weight_decay: 0.05, warmup_steps: 2000, clip_grad: 1.0, batch_size: 192}
train: {max_steps: 45000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 3000}
output: {out_dir: runs/brainmodel_tiny_pooled}

# Joint SSL + multitask foundation from scratch (brain.train.joint), ViT-S.
#   SSL branch: v3's 3D LeJEPA recipe (runs/v3/cls_s42: crops, dense + masked-prediction terms, CLS), global batch 192
#   (48 per GPU x 4, as v3's 96 x 2, so its lr carries over). Task branch: run 3's tasks and augmentation on whole
#   volumes (2 per GPU), no general slot. Encoder fixes: RoPE from a 32 mm shortest period (no aliased pairs), patch-max
#   foreground gate. Curriculum: SSL alone for 25% of steps, tasks ramp in over 15%, SSL tapers to half the task weight
#   by 60% (losses EMA-normalised, so the weights are shares).
#   sbatch --export=ALL,METHOD=joint,CONFIG=configs/joint/small.yaml jobs/train_pi4.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  default_spacing_mm: [1.0, 1.0, 1.0]
  default_origin_mm: [0.0, 0.0, 0.0]
  volume_size_xyz: [256, 256, 160]
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask
  val_per_task: 64
  val_max_seg: 4
model:
  size: small
  in_chans: 1
  proj_dim: 128
  proj_hidden: 2048
  qk_norm: true
  rope_base_mm: 100.0
  checkpoint: true
  proj_norm: batch
  length_buckets: 4
  dense_dim: 128
  dense_hidden: 1024
  n_cls: 1
  n_registers: 0
  rope_min_period_mm: 32.0
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8, width: null, mode: slots, cross_task: true, embedding: learned}
  seg:
    widths: [128, 64, 32, 16]
views:
  patch_xyz: [16, 16, 8]
  global:
    n: 2
    size_xyz: [128, 128, 64]
  local:
    n: 2
    size_xyz: [64, 64, 32]
  fine:
    n: 2
    size_xyz: [32, 32, 16]
    patch_xyz: [8, 8, 4]
  nested: true
  fg_min: 0.15
  retries: 8
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
    mode: max
aug:
  window: {mode: random, mix: brain_bone}
  curve: {p: 0.8, knots: 5, strength: 0.6, flip: 0.3}
  bias: {p: 0.5, amp: 0.3}
  noise:
    p: 0.5
    sigma: [0.02, 0.15]
    kind: rician
    snr: [15, 100]
  blur:
    p: 0.3
    sigma_vox: [0.5, 1.5]
  through_plane:
    p: 0.5
    fwhm_vox: [2.0, 6.0]
  drift: {p: 0.3, amp: 0.25}
  skull: {p: 0.3, per_view: true}
  geometric:
    p: 0.8
    rot_deg: [10, 10, 15]
    scale: [0.85, 1.15]
    flip_lr: 0.5
  histmatch:
    p: 0.15
    alpha: [0.5, 1.0]
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
loss:
  lamb: 0.03
  win_weight: 1.0
  local_pooled: false
  n_proj: 256
  gather_ddp: true
  dense: {weight: 1.0, tokens_per_view: 32, fine_weight: 0.0, stopgrad_mean: false}
  predict:
    weight: 1.0
    pixel_weight: 0.5
    pixel_cells: [2, 2, 2]
    blocks: 3
    block_tokens: [3, 6]
    depth: 4
    ramp_steps: 2000
    fine_weight: 0.0
    fine_blocks: 2
    fine_block_tokens: [2, 3]
  balance: ema
  ema_decay: 0.99
  seg_stride: 2
tasks: {k_max: 8, p_all: 0.2, rare_beta: 0.5, max_seg: 2}
optim: {lr: 0.00025, weight_decay: 0.05, warmup_steps: 2000, clip_grad: 1.0, batch_size: 48}
train: {max_steps: 60000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 5000, stop_poll: 20, best_metric: loss}
joint: {ssl_floor: 0.5, warmup_frac: 0.25, task_ramp_frac: 0.15, taper_end_frac: 0.6, task_batch_size: 2, task_workers: 6,
  normalize: true}
output: {out_dir: runs/joint/small_s42}

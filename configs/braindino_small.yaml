# Slice-wise DINOv2 + iBOT, roughly BrainDINO (arXiv:2604.27277) stage 1.
# Same v4 slab store and 2D ViT-S backbone as the LeJEPA small runs, so frozen
# downstream loaders consume ckpt['model'] as a VisionTransformer.
#
# Paper used ViT-B/16, 4 A100s, batch 256/GPU, 500k steps, K=65536, then a
# 1024^2 high-res stage. This comparison run is ViT-S, 2x L40S, shorter schedule,
# no high-res stage. Crops follow the paper (2 global 256 + 8 local 112).
#
#   sbatch jobs/train_braindino_pi.sbatch

seed: 42

data:
  slices_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  slices_per_read: 2
  balance_alpha: 0.5
  priority_beta: 0.0
  priority_clip: 3.0

model:
  size: small
  img_size: 256
  patch_size: 16
  proj_dim: 128
  proj_hidden: 2048
  registers: 4
  qk_norm: true
  proto_dim: 65536
  head_hidden: 2048
  head_bottleneck: 256

loss:
  student_temp: 0.1
  teacher_temp: 0.04
  ema: 0.994
  ibot_weight: 1.0
  koleo_weight: 0.1
  mask_prob: 0.5
  mask_ratio: [0.1, 0.5]
  center_momentum: 0.9

optim:
  lr: 0.0001
  weight_decay: 0.04
  warmup_steps: 2000
  clip_grad: 3.0
  layer_decay: 0.9
  batch_size: 64
  compile: false
  num_workers: 7
  prefetch_factor: 2
  n_global: 2
  n_local: 8
  global_area: [0.32, 1.0]
  local_area: [0.05, 0.32]
  local_size: 112
  max_rot: 10

views:
  window:
    mode: random
    mix: v4

train:
  max_steps: 40000
  log_every: 50
  eval_every: 2000
  eval_batches: 8
  ckpt_every: 1000
  keep_every: 10000

output:
  out_dir: runs/braindino_small

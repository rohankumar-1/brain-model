# ViT-Tiny LeJEPA. Two global 256 crops and six local 96 crops, every view pulled
# toward the mean of the globals, plus SIGReg (lamb 0.02).
# batch_size is slices per GPU per step. 60k steps x 384 slices is about 19 epochs
# of slices_core. Crop areas are fractions of the image area.

seed: 42

data:
  slices_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_core
  slices_per_read: 2      # slices taken per 8-slice chunk decode
  balance_alpha: 0.5      # 1 = natural mix, 0 = uniform over dataset families

model:
  size: tiny
  img_size: 256
  patch_size: 16
  proj_dim: 128
  proj_hidden: 2048
  registers: 4
  qk_norm: true

optim:
  lr: 0.0005
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 384
  compile: true
  num_workers: 7
  prefetch_factor: 2
  lamb: 0.02
  n_global: 2
  n_local: 6
  global_area: [0.4, 1.0]
  local_area: [0.05, 0.4]
  local_size: 96
  max_rot: 10

train:
  max_steps: 60000
  log_every: 100
  eval_every: 2000
  eval_batches: 8
  ckpt_every: 1000
  keep_every: 10000

output:
  out_dir: runs/vit_tiny_v2

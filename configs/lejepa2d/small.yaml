# ViT-Small LeJEPA (22M params). Same recipe as vit_tiny; about 3.5x the compute
# per slice, so it is meant for multi-GPU runs:
#   torchrun --standalone --nproc_per_node=4 -m brain.train lejepa2d --config configs/lejepa2d/small.yaml
# batch_size is per GPU. With 4 GPUs the global batch is 4 x 256 = 1024 slices,
# so the peak lr is scaled up from tiny.

seed: 42

data:
  slices_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_core
  slices_per_read: 2
  balance_alpha: 0.5

model:
  size: small
  img_size: 256
  patch_size: 16
  proj_dim: 128
  proj_hidden: 2048
  registers: 4
  qk_norm: true

optim:
  lr: 0.001
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 256
  compile: true
  num_workers: 7
  prefetch_factor: 2
  lamb: 0.02
  n_global: 2
  n_local: 6
  global_area: [0.4, 1.0]
  local_area: [0.05, 0.4]
  local_size: 96
  max_rot: 10

train:
  max_steps: 40000
  log_every: 100
  eval_every: 2000
  eval_batches: 8
  ckpt_every: 1000
  keep_every: 10000

output:
  out_dir: runs/vit_small_v2

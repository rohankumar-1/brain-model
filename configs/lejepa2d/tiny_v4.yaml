# ViT-Tiny LeJEPA on the v4 native-unit store. Random asinh window per view.
# batch_size is slices per GPU per step. 2-GPU DDP doubles the global batch.

seed: 42

data:
  slices_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  slices_per_read: 2
  balance_alpha: 0.5
  priority_beta: 0.0
  priority_clip: 3.0

model:
  size: tiny
  img_size: 256
  patch_size: 16
  proj_dim: 128
  proj_hidden: 2048
  registers: 4
  qk_norm: true

optim:
  lr: 0.0005
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 384
  compile: true
  num_workers: 7
  prefetch_factor: 2
  lamb: 0.02
  n_global: 2
  n_local: 6
  global_area: [0.4, 1.0]
  local_area: [0.05, 0.4]
  local_size: 96
  max_rot: 10

views:
  window:
    mode: random   # fixed | random | slice

train:
  max_steps: 45000
  log_every: 100
  eval_every: 2000
  eval_batches: 8
  ckpt_every: 1000
  keep_every: 5000

output:
  out_dir: runs/vit_tiny_v4

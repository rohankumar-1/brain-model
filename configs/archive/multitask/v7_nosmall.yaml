# Task-conditioned multitask post-training, run 6: run 5 (v6_nogen_unc.yaml) without the small clinical tasks.
# The small-label tasks (55-350 training scans) peak within a few thousand steps and then overfit, never learn well even
# in training (MMSE R2 0.06, ADOS < 0), and their addition (run 3 on) coincided with run 2's tasks losing accuracy.
# Hypothesis: ViT-S has no capacity to spare for them. Removed from training (labels and suite tasks kept): mmse,
# autism_severity, adhd, parkinsons, glioma_survival_12m, glioma_lower_grade, glioma_idh. Nothing else changes.
#   sbatch --export=ALL,METHOD=multitask,CONFIG=configs/multitask/v7_nosmall.yaml jobs/train_pi4.sbatch
#
# Task-conditioned multitask post-training, run 5: run 3 (v4_general.yaml) without the general-embedding slot and with
# uncertainty loss balancing (a learned log-variance per task: exp(-s) * L + s, inside the group-first average), instead
# of EMA normalisation. Eval A showed run 3's heads losing to run 2 on CT density / CSF, tumour volume and
# segmentation; this tests whether removing the general LeJEPA term and learned task weights recover them. Two
# changes at once: a recovery cannot be split between them without a general-slot-only ablation.
#   sbatch --export=ALL,METHOD=multitask,CONFIG=configs/multitask/v6_nogen_unc.yaml jobs/train_pi4.sbatch
#
# Task-conditioned multitask post-training, run 3. As v3_synthseg.yaml (run 2), plus:
#   - the general-embedding slot: LeJEPA (prediction + SIGReg) on a task-agnostic query over two global views (the
#     training view, and a rotated / shifted / cropped second view of half the batch);
#   - data: BHSD + HemSeg hemorrhage masks, 16 small FOMO cohorts (infants, elderly, 7T, other countries);
#   - tasks: WMH burden, hemorrhage segmentation, MMSE, ADOS severity, glioma survival / grade / IDH, infant
#     abnormality, ADHD, Parkinson's; age / sex on the new cohorts.
# Run 2 notes (kept):
#   - 62-task registry: SynthSeg anatomy (12 structure masks, 18 volumes / ratios / asymmetries), task groups
#     balancing sampling and loss, registration QC on alignment-dependent targets only, HBN PD out of the pool;
#   - appearance augmentation (bias field, through-plane blur, Rician / Gaussian noise, blur, drift; canonical window)
#     and field-of-view cuts against cohort shortcuts;
#   - a gentler encoder (0.1 x the head LR, was 0.25): run 1 lost unseen-lesion segmentation (ATLAS 0.32 -> 0.25).
#   sbatch --export=ALL,METHOD=multitask,CONFIG=configs/multitask/v4_general.yaml jobs/train_pi4.sbatch
seed: 42

data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v2
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64          # cohort-stratified picker (brain.multitask.data.pick_val_volumes); runs before 2026-10-24 used 16 by id
  val_max_seg: 4

model:
  init_from: runs/v3/cls_s42/best.pt      # step 18000
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8, width: null, mode: slots, cross_task: true, embedding: learned}
  seg: {widths: [128, 64, 32, 16]}
  general: {enabled: false, proj_dim: 128}     # run 3: enabled

tasks:
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  exclude: [mmse, autism_severity, adhd, parkinsons, glioma_survival_12m, glioma_lower_grade, glioma_idh]

aug:
  flip_lr: 0.5
  affine: {p: 0.8, rot_deg: [8, 8, 12], shift_mm: 8.0}
  appearance:
    bias: {p: 0.3, amp: 0.2}                      # MRI only; mild, as intensity asymmetry is a target
    through_plane: {p: 0.3, fwhm_vox: [2.0, 6.0]}
    noise: {p: 0.5, kind: rician, snr: [15, 100], sigma: [0.02, 0.1]}   # Rician on MRI, Gaussian on CT
    blur: {p: 0.2, sigma_vox: [0.5, 1.0]}
    drift: {p: 0.2, amp: 0.1}
  fov_cut: {p: 0.2, mm: [10, 40]}

loss:
  balance: uncertainty     # run 3: ema
  ema_decay: 0.99
  seg_stride: 2
  general: {weight: 0.0, frac: 0.5, lamb: 0.02, n_proj: 256, crop_min: 0.7, rot_deg: [8, 8, 12], shift_mm: 8.0}

optim:
  lr: 3.0e-4
  enc_lr_mult: 0.1
  layer_decay: 0.8
  weight_decay: 0.05
  warmup_steps: 1000
  freeze_steps: 1000       # heads and slots only, then the encoder joins
  clip_grad: 1.0
  batch_size: 4            # per GPU, on 4 GPUs (train_pi4): global 16 as run 2's 2 x 8; 2 x 8 OOMed with the general views

train:
  max_steps: 20000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 1000         # dense snapshots for the task-embedding dynamics (brain.multitask.explain dynamics)
  best_metric: loss

output:
  out_dir: runs/multitask/v7nosmall_s42

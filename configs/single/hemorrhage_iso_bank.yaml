# Window-bank arm (2026-11-07, runs/diagnostics/ngeo/CONTRACT.md 4): hemorrhage_scratch_hybrid (1 mm iso template grid,
#   ViT-S + conv stem [32, 64], from random init, 30k steps, same data / tasks / heads / schedule) with the shared learned
#   window bank: the encoder takes native units, calibrates them to tissue units (CT (HU-40)/40, MRI (z-0.5)/1.5) and
#   windows them through 6 learnable asinh windows (brain.models.window_bank) -> 6 input channels for the conv stem
#   and the decoder's image pyramid. Bank LR 0.1x, no weight decay. Augmentation: CT gets no window jitter, instead a
#   calibration offset / scale (ct_physical), a reconstruction-kernel blur / sharpen (kernel), HU noise (noise.sigma_hu)
#   and the slice-thickness blur (through_plane); MRI augmentations as before, on z before the bank.
#   Compare with hemorrhage_scratch_hybrid (fixed canonical window) and the fixed3 / ngeo arms (branch ngeo-model).
#   sbatch -p pi_dbertsim,mit_normal_gpu -G l40s:2 -c 24 --mem=180G -t 06:00:00 -x node3006 -J s-hem-bank \
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=2,CONFIG=configs/single/hemorrhage_iso_bank.yaml jobs/train.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v10
  registry: null
  volume_size_xyz: [256, 256, 160]
  default_spacing_mm: [1.0, 1.0, 1.0]
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64
  val_max_seg: 4
  rsna_slices: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/rsna_slices/rsna_slices.parquet
  exclude_datasets: [rsna_ica]    # RSNA-ICA out of training for now (user, 2026-11-01)
  fastmri_boxes: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/fastmri_boxes.parquet
model:
  init_from: null
  size: small
  conv_stem: [32, 64]
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8}
  seg:
    widths: [128, 64, 32, 16]
  rope_fp32: true
  fp32_residual: true
  meta: {enabled: false}
  task_tokens: {enabled: false}
  regression: {kind: hlgauss, bins: 80, range: [-5.0, 5.0], sigma_ratio: 0.75}
  token_map: {enabled: true, dim: 64}
  window_bank: {enabled: true, k: 6, init: contract6, per_modality: false, lr_mult: 0.1, decoder_grad: false}
views:
  patch_xyz: [16, 16, 8]
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
    mode: frac            # a token counts when >= 25% of its voxels are foreground (centre mode lost 1.2% of brain)
    min_frac: 0.25
tasks:
  ssl: true
  mask_p: 0.1
  max_dense: 1
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {}
  groups: null
  ids: [hemorrhage_any, hemorrhage_epidural, hemorrhage_intraparenchymal, hemorrhage_intraventricular, hemorrhage_subarachnoid, hemorrhage_subdural, hemorrhage_segmentation]
  exclude: []
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
      sigma_hu: [2.0, 15.0]       # CT rows (window bank: Gaussian noise in HU)
    ct_physical: {p: 0.5, offset_hu: 10.0, scale: 0.03}
    kernel: {p: 0.3, sigma_vox: [0.3, 1.0], sharpen: 0.5, amount: [0.2, 1.0]}
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
  skull_strip: {p: 0.3}
  task_aware: true
loss: {seg_stride: 2, uncertainty_clamp: 1.0, token_weight: 0.5, slice_weight: 0.5, box_weight: 0.5}
optim:
  lr: 0.0004
  enc_lr_mult: 1.0
  layer_decay: 1.0
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 8
  schedule: wsd
  decay_steps: 6000
  betas: [0.9, 0.999]
train: {max_steps: 30000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 10000, stop_poll: 20, best_metric: score,
  ema_decay: 0.999, keep_full: false}
output: {out_dir: runs/single/hemorrhage_iso_bank, resume_from: null}

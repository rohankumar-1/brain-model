# From-scratch single-task baseline (2026-11-03), ViT-S encoder.
#   Tumour family (BraTS / UPENN masks, tumour volume, glioma survival + MGMT, tumour type), from random init, 30k steps (WSD 4e-4, warmup 2000, no
#   layer decay), 2 GPUs (batch 16). The ViT / ResNet pair differs only in the encoder (22.2M / 22.1M parameters, both
#   384-wide tokens on the 16 x 16 x 8 grid): same slot readout (no task tokens, no scan metadata: a ResNet has no
#   tokens to add), heads, data, augmentation, token maps and HL-Gauss.
#   sbatch -p pi_dbertsim,mit_normal_gpu -G l40s:2 -c 24 --mem=180G -t 06:00:00 -J s-tum-vit \
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=2,CONFIG=configs/single/tumor_scratch_vit.yaml jobs/train.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v10
  registry: null
  volume_size_xyz: [256, 256, 160]
  default_spacing_mm: [1.0, 1.0, 1.0]
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64
  val_max_seg: 4
  rsna_slices: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/rsna_slices/rsna_slices.parquet
  exclude_datasets: [rsna_ica]    # RSNA-ICA out of training for now (user, 2026-11-01)
  fastmri_boxes: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/fastmri_boxes.parquet
model:
  init_from: null
  size: small
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8}
  seg:
    widths: [128, 64, 32, 16]
  rope_fp32: true
  fp32_residual: true
  meta: {enabled: false}
  task_tokens: {enabled: false}
  regression: {kind: hlgauss, bins: 80, range: [-5.0, 5.0], sigma_ratio: 0.75}
  token_map: {enabled: true, dim: 64}
views:
  patch_xyz: [16, 16, 8]
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
    mode: frac            # a token counts when >= 25% of its voxels are foreground (centre mode lost 1.2% of brain)
    min_frac: 0.25
tasks:
  ssl: true
  mask_p: 0.1
  max_dense: 1
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {}
  groups: null
  ids: [whole_tumor, tumor_core, enhancing_tumor, resection_cavity, tumor_volume, glioma_survival_12m, glioma_mgmt, tumor_type]
  exclude: []
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
  skull_strip: {p: 0.3}
  task_aware: true
loss: {balance: uncertainty, ema_decay: 0.99, seg_stride: 2, uncertainty_clamp: 1.0, token_weight: 0.5, slice_weight: 0.5, box_weight: 0.5}
optim:
  lr: 0.0004
  enc_lr_mult: 1.0
  layer_decay: 1.0
  weight_decay: 0.05
  warmup_steps: 2000
  freeze_steps: 0
  clip_grad: 1.0
  batch_size: 8
  schedule: wsd
  decay_steps: 6000
  betas: [0.9, 0.999]
train: {max_steps: 30000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 10000, stop_poll: 20, best_metric: score,
  ema_decay: 0.999, keep_full: false}
output: {out_dir: runs/single/tumor_scratch_vit, resume_from: null}

# 3D MAE v2 (pure reconstruction): Primus-style ViT-small (384 wide) on 8 x 8 x 4 mm tokens; decoder 256 wide.
# Harder task than v1 (whose 75% random masking was mostly interpolation: a no-learning smoother scores R2 0.65):
#   - mask ratio drawn per crop in [0.6, 0.9], a few contiguous blocks topped up with random tokens;
#   - lesion-aware: 30-50% of each crop's lesion tokens forced visible (BraTS subjects, all four sequences), so small
#     lesions are seldom hidden whole and the model must extend what it sees; lesion tokens weigh 2x in the loss;
#   - split target: per-patch-normalised voxels (structure) + per-patch mean and std (absolute contrast).
#   Encoder sees 25% of each crop's foreground tokens; a 4-block, 384-wide decoder reconstructs the voxels of the rest
#   in windowed units (absolute contrast kept: no per-patch normalisation).
#   Two 128 x 128 x 64 mm crops per scan (4096 tokens each, ~1000 encoded), per-view geometric augmentation, mild
#   appearance augmentation (no contrast curve / histogram matching), data balancing as in the v3 LeJEPA run.
#   jobs/train_pi.sbatch with METHOD=mae3d CONFIG=configs/mae3d/base.yaml
seed: 42

data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]

model:
  size: small
  mlp: swiglu
  layer_scale: 0.1
  drop_path: 0.1
  qk_norm: true
  rope_base_mm: 100.0
  checkpoint: false        # small model: memory to spare, skip the ~25% recompute
  length_buckets: 4
  n_cls: 0
  n_registers: 0
  decoder: {dim: 256, depth: 4, heads: 4}

views:
  patch_xyz: [8, 8, 4]
  global: {n: 2, size_xyz: [128, 128, 64]}
  nested: false
  win: false
  fg_min: 0.15

aug:
  window: {mode: random, mix: brain_bone}
  curve: {p: 0.0}
  noise: {p: 0.5, kind: rician, snr: [15, 100], sigma: [0.02, 0.15]}
  bias: {p: 0.5, amp: 0.3}
  through_plane: {p: 0.3, fwhm_vox: [2.0, 6.0]}
  blur: {p: 0.2, sigma_vox: [0.5, 1.0]}
  drift: {p: 0.2, amp: 0.2}
  skull: {p: 0.3, per_view: true}
  geometric: {p: 0.8, rot_deg: [10, 10, 15], scale: [0.85, 1.15], flip_lr: 0.5}

loss:
  predict:
    weight: 1.0
    mask_ratio: [0.6, 0.9]
    blocks: 4
    block_tokens: [2, 4]
    target: split
    lesion: {visible: [0.3, 0.5], weight: 2.0}

optim:
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 28          # volumes per GPU (two crops each); 48 without checkpointing ran out of memory (44 GB L40S)

train:
  max_steps: 30000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 3000

output:
  out_dir: runs/mae3d/small_v2_s42

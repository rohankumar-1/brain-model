# E1 (2026-10-29): is the slow encoder why CQ500 / RSNA hemorrhage plateau? Every multitask and joint run so far trained
# the encoder at 0.1-0.5x the head LR (probes flat across runs); the hemorrhage-only specialist, the one model at 1.0x
# (runs/single/hemorrhage), reached RSNA hemorrhage_any 0.956 test vs 0.91-0.92 for every multitask run.
# This is arm B of the 2026-10-26 comparison (runs/multitask/omni_b_tokens = BQ-12k-tokens) verbatim, its full resolved
# config, so no default changed since leaks in, with only two changes:
#   optim.enc_lr_mult 0.25 -> 1.0, optim.layer_decay 0.8 -> 0.75 (the specialist's values)
# Next if E1 helps: E2 = E1 without the CT SynthSeg targets (test-retest ICC 0.22-0.79 on RSNA CT,
# runs/diagnostics/synthseg_ct_reliability.py), E3 = E1 with read-only task tokens.
#   sbatch -p pi_dbertsim -c 12 --mem=96G -t 24:00:00 -J e1-enclr1 \
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=1,CONFIG=configs/multitask/e1_enclr1.yaml jobs/train.sbatch
# Compare: python -m brain.multitask.test_eval --ckpts BQ-12k-tokens runs/multitask/e1_enclr1/best.pt, then
#   python -m brain.multitask.transfer_heads and python -m brain.bench run on the checkpoint.
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v2
  registry: null
  volume_size_xyz:
  - 256
  - 256
  - 160
  default_spacing_mm:
  - 1.0
  - 1.0
  - 1.0
  num_workers: 12
  balance_alpha: 0.5
  balance_groups:
    brats:
    - brats_gli
    - brats_men
    - brats_ped
    - brats_goat
  val_per_task: 64
  val_max_seg: 4
model:
  init_from: runs/v3/cls_s42/best.pt
  checkpoint: true
  taps:
  - 3
  - 7
  slot:
    dim: 256
    layers: 3
    heads: 8
    width: null
    mode: slots
    cross_task: true
    embedding: learned
  seg:
    widths:
    - 128
    - 64
    - 32
    - 16
  general:
    enabled: false
    proj_dim: 128
  rope_fp32: false
  fp32_residual: false
  meta:
    enabled: true
    drop: 0.2
  task_tokens:
    enabled: true
    write_bias: 10.0
    write_ramp_steps: 2000
  size: small
  in_chans: 1
  proj_dim: 128
  proj_hidden: 2048
  qk_norm: true
  rope_base_mm: 100.0
  proj_norm: batch
  length_buckets: 4
  dense_dim: 128
  dense_hidden: 1024
  n_cls: 1
  n_registers: 0
views:
  patch_xyz:
  - 16
  - 16
  - 8
  global:
    n: 2
    size_xyz:
    - 128
    - 128
    - 64
  local:
    n: 2
    size_xyz:
    - 64
    - 64
    - 32
  fine:
    n: 2
    size_xyz:
    - 32
    - 32
    - 16
    patch_xyz:
    - 8
    - 8
    - 4
  nested: true
  fg_min: 0.15
  retries: 8
  gate:
    ct_hu:
    - -500.0
    - 200.0
    mri_lo: -5.5
tasks:
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {}
  groups: null
  ids: null
  exclude:
  - mmse
  - autism_severity
  - adhd
  - parkinsons
  - glioma_survival_12m
  - glioma_lower_grade
  - glioma_idh
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg:
    - 8
    - 8
    - 12
    shift_mm: 8.0
  appearance:
    bias:
      p: 0.3
      amp: 0.2
    through_plane:
      p: 0.3
      fwhm_vox:
      - 2.0
      - 6.0
    noise:
      p: 0.5
      kind: rician
      snr:
      - 15
      - 100
      sigma:
      - 0.02
      - 0.1
    blur:
      p: 0.2
      sigma_vox:
      - 0.5
      - 1.0
    drift:
      p: 0.2
      amp: 0.1
  fov_cut:
    p: 0.2
    mm:
    - 10
    - 40
  skull_strip:
    p: 0.3
loss:
  balance: uncertainty
  ema_decay: 0.99
  seg_stride: 2
  general:
    weight: 0.0
    frac: 0.5
    lamb: 0.02
    n_proj: 256
    crop_min: 0.7
    rot_deg:
    - 8
    - 8
    - 12
    shift_mm: 8.0
  uncertainty_clamp: 1.0
optim:
  lr: 0.0003
  enc_lr_mult: 1.0
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_steps: 1000
  freeze_steps: 0
  clip_grad: 1.0
  batch_size: 8
  schedule: cosine
  decay_steps: null
  betas:
  - 0.9
  - 0.999
train:
  max_steps: 12000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 12000
  stop_poll: 20
  best_metric: loss
  keep_full: false
output:
  out_dir: runs/multitask/e1_enclr1
  resume_from: null

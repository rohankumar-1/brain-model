# R7-SSL (2026-10-29): self-supervised tasks phase 1 -- R7 (configs/multitask/r7_targets.yaml) with only these changes:
#   * tasks.ssl: the registry's self-supervised dense tasks train with the rest: masked_recon (a quarter of the samples,
#     tasks.mask_p, hide 60% of their foreground tokens and ask only self-supervised tasks) and contrast synthesis
#     (synth_t1 / t1c / t2 / flair / ct, one shared token) on sessions whose contrasts share a grid (BraTS, UPENN-GBM;
#     SynthRAD CT / MR once prepped);
#   * labels/multitask_v5: labels/multitask_v4 plus the self-supervised rows (same registry otherwise).
# Same steps, batch and schedule as R7, so the comparison is at equal compute: a quarter of the samples carry no
# supervised task. Compare the final checkpoints (best_metric ``loss`` now also averages the synthesis tasks).
#   LABELS_OUT=/home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v5 \
#     sbatch -p mit_quicktest -t 00:15:00 jobs/multitask_labels.sbatch
#   sbatch -p pi_dbertsim -c 12 --mem=96G -t 24:00:00 -J r7-ssl \
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=1,CONFIG=configs/multitask/r7_ssl.yaml jobs/train.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v5
  registry: null
  volume_size_xyz: [256, 256, 160]
  default_spacing_mm: [1.0, 1.0, 1.0]
  num_workers: 12
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64
  val_max_seg: 4
model:
  init_from: runs/v4/scratch_s42/last.pt
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8}
  seg:
    widths: [128, 64, 32, 16]
  rope_fp32: false
  fp32_residual: false
  meta: {enabled: true, drop: 0.2}
  task_tokens: {enabled: true, share: true, write_bias: 10.0, write_ramp_steps: 2000}
views:
  patch_xyz: [16, 16, 8]
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
tasks:
  ssl: true
  mask_p: 0.25
  mask_ratio: 0.6
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {}
  groups: null
  ids: null
  exclude: [mmse, autism_severity, adhd, parkinsons, glioma_lower_grade, glioma_idh, ct_gray_white_ratio,
    vol_hippocampus, vol_amygdala, vol_thalamus, vol_caudate, vol_putamen, vol_cortex, vol_white_matter, vol_cerebellum,
    vol_brainstem, vol_log_ventricles, vol_log_csf]
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
  skull_strip: {p: 0.3}
loss: {seg_stride: 2, uncertainty_clamp: 1.0}
optim:
  lr: 0.0003
  enc_lr_mult: 1.0
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_steps: 1000
  clip_grad: 1.0
  batch_size: 8
  schedule: cosine
  decay_steps: null
  betas: [0.9, 0.999]
train: {max_steps: 12000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 12000, stop_poll: 20, best_metric: loss,
  keep_full: false}
output: {out_dir: runs/multitask/r7_ssl, resume_from: null}

# Task-conditioned multitask post-training, milestone 2-4: the v3 LeJEPA encoder (ViT-S, 16 x 16 x 8 mm tokens, CLS)
# on whole 256 x 256 x 160 volumes, learned task embeddings (one per registry task), typed shared heads, FiLM decoder.
# Tasks: configs/multitask/registry.yaml (role: train); labels: python -m brain.multitask.labels (jobs/multitask_labels.sbatch).
#   sbatch --export=ALL,METHOD=multitask,CONFIG=configs/multitask/v3_init.yaml jobs/train_pi.sbatch
seed: 42

data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64          # cohort-stratified picker (brain.multitask.data.pick_val_volumes); runs before 2026-10-24 used 16 by id
  val_max_seg: 4

model:
  init_from: runs/v3/cls_s42/best.pt      # step 18000
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8, width: null, mode: slots, cross_task: true, embedding: learned}
  seg: {widths: [128, 64, 32, 16]}

tasks: {k_max: 8, p_all: 0.2, rare_beta: 0.5, max_seg: 2}

aug:
  flip_lr: 0.5
  affine: {p: 0.8, rot_deg: [8, 8, 12], shift_mm: 8.0}

loss: {balance: ema, ema_decay: 0.99, seg_stride: 2}

optim:
  lr: 3.0e-4
  enc_lr_mult: 0.25
  layer_decay: 0.8
  weight_decay: 0.05
  warmup_steps: 1000
  freeze_steps: 1000       # heads and slots only, then the encoder joins
  clip_grad: 1.0
  batch_size: 8            # whole volumes per GPU

train:
  max_steps: 20000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 5000
  best_metric: loss

output:
  out_dir: runs/multitask/v3init_s42

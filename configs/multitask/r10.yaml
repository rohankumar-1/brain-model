# R10 (2026-10-31): R9 (configs/multitask/r9.yaml) with
#   * 4 GPUs: global batch 32 (8 per GPU) instead of 8; LR 6e-4 (sqrt scaling from R9's 3e-4 at batch 8), warmup 1500;
#     same 30k steps, so 4x the samples;
#   * task-aware augmentation (aug.task_aware): scans asked a registry ``fine`` task (the aneurysm tasks, vessels,
#     epidural / subdural) get no through-plane or isotropic blur, field-of-view cut or skull stripping;
#   * a weight average (train.ema_decay 0.999), evaluated beside the live weights at every eval; last_ema.pt /
#     best_ema.pt for the benchmark, so both weight sets can be scored;
#   * where-tasks for aneurysms: aneurysm_location (4 mm balls at the annotated points) and seg_vessels (13 vessel
#     labels merged, 178 series), from brain.prep.rsna_ica_vessels; labels/multitask_v7.
# Not yet: the finder head / find -> refine pass, distillation, the MRA contrast label (rsna_ica_mra is "t1").
#   sbatch -p pi_dbertsim,mit_normal_gpu -G l40s:4 -c 48 --mem=360G -t 06:00:00 -J r10 \   (6 h chunks, requeues)
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=4,CONFIG=configs/multitask/r10.yaml jobs/train.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v7
  registry: null
  volume_size_xyz: [256, 256, 160]
  default_spacing_mm: [1.0, 1.0, 1.0]
  num_workers: 10
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64
  val_max_seg: 4
model:
  init_from: runs/v4/scratch_s42/last.pt
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8}
  seg:
    widths: [128, 64, 32, 16]
  rope_fp32: false
  fp32_residual: false
  meta: {enabled: true, drop: 0.2}
  task_tokens: {enabled: true, share: true, write_bias: 10.0, write_ramp_steps: 2000}
views:
  patch_xyz: [16, 16, 8]
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
tasks:
  ssl: true
  mask_p: 0.1
  max_dense: 1
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {synthesis: 0.5}
  groups: null
  ids: null
  exclude: [mmse, autism_severity, adhd, parkinsons, glioma_lower_grade, glioma_idh, ct_gray_white_ratio,
    vol_hippocampus, vol_amygdala, vol_thalamus, vol_caudate, vol_putamen, vol_cortex, vol_white_matter, vol_cerebellum,
    vol_brainstem, vol_log_ventricles, vol_log_csf]
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
  skull_strip: {p: 0.3}
  task_aware: true
loss: {seg_stride: 2, uncertainty_clamp: 1.0}
optim:
  lr: 0.0006
  enc_lr_mult: 1.0
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_steps: 1500
  clip_grad: 1.0
  batch_size: 8
  schedule: cosine
  decay_steps: null
  betas: [0.9, 0.999]
train: {max_steps: 30000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 10000, stop_poll: 20, best_metric: loss,
  ema_decay: 0.999, keep_full: false}
output: {out_dir: runs/multitask/r10, resume_from: null}

# R8 (2026-10-30): R7 (configs/multitask/r7_targets.yaml) after the R7 / R7-SSL comparison, with:
#   * 30k steps instead of 12k (R7's training loss still fell from 6-8k to 10-12k steps for most groups, and its
#     validation score rose until the LR annealed);
#   * contrast synthesis kept (synth_t1 / t1c / t2 / flair / ct; BraTS, UPENN-GBM, SynthRAD) on its own decoder budget
#     (tasks.max_dense: 1) at half group weight: in R7-SSL it shared max_seg and cut tumour-segmentation asks per BraTS
#     sample from 0.72 to 0.32 (sampler replay), and tumour Dice dropped;
#   * masked reconstruction dropped (tasks.mask_p 0: a quarter of the samples carried no supervised task, and v4's
#     pretraining already predicts pixels);
#   * the nine aneurysm tasks excluded: chance AUC in R7 and R7-SSL, training loss flat at the base rate from 6k steps
#     (aneurysms of 2-10 mm against 16 mm tokens and a whole-head yes/no; back with a localisation target).
# Labels: labels/multitask_v5.
#   sbatch -p pi_dbertsim -c 12 --mem=96G -t 24:00:00 -J r8 \
#     --export=ALL,METHOD=multitask,EXPECT_GPUS=1,CONFIG=configs/multitask/r8.yaml jobs/train.sbatch
seed: 42
data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  labels_dir: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr/labels/multitask_v5
  registry: null
  volume_size_xyz: [256, 256, 160]
  default_spacing_mm: [1.0, 1.0, 1.0]
  num_workers: 12
  balance_alpha: 0.5
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]
  val_per_task: 64
  val_max_seg: 4
model:
  init_from: runs/v4/scratch_s42/last.pt
  checkpoint: true
  taps: [3, 7]
  slot: {dim: 256, layers: 3, heads: 8, cross_task: true}
  seg:
    widths: [128, 64, 32, 16]
  rope_fp32: false
  fp32_residual: false
  meta: {enabled: true, drop: 0.2}
  task_tokens: {enabled: true, share: true, write_bias: 10.0, write_ramp_steps: 2000}
views:
  patch_xyz: [16, 16, 8]
  gate:
    ct_hu: [-500.0, 200.0]
    mri_lo: -5.5
tasks:
  ssl: true
  mask_p: 0.0
  max_dense: 1
  k_max: 8
  p_all: 0.2
  rare_beta: 0.5
  max_seg: 2
  group_weights: {synthesis: 0.5}
  groups: null
  ids: null
  exclude: [mmse, autism_severity, adhd, parkinsons, glioma_lower_grade, glioma_idh, ct_gray_white_ratio,
    vol_hippocampus, vol_amygdala, vol_thalamus, vol_caudate, vol_putamen, vol_cortex, vol_white_matter, vol_cerebellum,
    vol_brainstem, vol_log_ventricles, vol_log_csf, masked_recon,
    aneurysm_present, aneurysm_ica_infraclinoid, aneurysm_ica_supraclinoid, aneurysm_mca, aneurysm_acom, aneurysm_aca, aneurysm_pcom, aneurysm_basilar_tip, aneurysm_posterior_other]
aug:
  flip_lr: 0.5
  affine:
    p: 0.8
    rot_deg: [8, 8, 12]
    shift_mm: 8.0
  appearance:
    bias: {p: 0.3, amp: 0.2}
    through_plane:
      p: 0.3
      fwhm_vox: [2.0, 6.0]
    noise:
      p: 0.5
      kind: rician
      snr: [15, 100]
      sigma: [0.02, 0.1]
    blur:
      p: 0.2
      sigma_vox: [0.5, 1.0]
    drift: {p: 0.2, amp: 0.1}
  fov_cut:
    p: 0.2
    mm: [10, 40]
  skull_strip: {p: 0.3}
loss: {balance: uncertainty, ema_decay: 0.99, seg_stride: 2, uncertainty_clamp: 1.0}
optim:
  lr: 0.0003
  enc_lr_mult: 1.0
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_steps: 1000
  freeze_steps: 0
  clip_grad: 1.0
  batch_size: 8
  schedule: cosine
  decay_steps: null
  betas: [0.9, 0.999]
train: {max_steps: 30000, log_every: 50, eval_every: 1000, ckpt_every: 500, keep_every: 10000, stop_poll: 20, best_metric: loss,
  keep_full: false}
output: {out_dir: runs/multitask/r8, resume_from: null}

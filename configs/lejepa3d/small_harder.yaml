# Continue the FOMO small run with a slightly harder appearance + dense + predict job.
# Weights from output.init_from (fresh optimizer and schedule). Predictor architecture is
# unchanged so its weights load; stopgrad_mean and the window mix do not add parameters.
#
# What changed vs configs/brainmodel_small_lejepa.yaml, and why:
#   aug.window.mix tissue — the brain mix draws near-identical asinh windows, so inv/win
#     flatten to ~0 with little left to learn. tissue still overlaps but the two views
#     differ more, so invariance has to ignore contrast rather than copy appearance.
#   dense.stopgrad_mean — each overlapping token matches a frozen consensus instead of
#     drifting with it. Same overlap geometry, harder target.
#   predict blocks 4, sides [4, 7] — hide a bit more of the global crop. That term is
#     the one that moved lesion-lift and position R2 on tiny; inv/win weights are left
#     alone because scaling a near-zero MSE just overfits noise.
# Do not start this while runs/brainmodel_small_fomo is still writing last.pt.

seed: 42

data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  default_spacing_mm: [1.0, 1.0, 1.0]
  default_origin_mm: [0.0, 0.0, 0.0]
  volume_size_xyz: [256, 256, 128]
  num_workers: 10
  balance_alpha: 0.5

model:
  size: small
  in_chans: 1
  proj_dim: 128
  proj_hidden: 2048
  qk_norm: true
  rope_base_mm: 100.0
  checkpoint: true
  proj_norm: batch
  length_buckets: 4
  dense_dim: 128
  dense_hidden: 1024

views:
  patch_xyz: [16, 16, 8]
  global: {n: 2, size_xyz: [128, 128, 64]}
  local: {n: 2, size_xyz: [64, 64, 32]}
  fine: {n: 2, size_xyz: [32, 32, 16], patch_xyz: [8, 8, 4]}
  nested: true
  fg_min: 0.15
  retries: 8
  gate: {ct_hu: [-500.0, 200.0], mri_lo: -5.5}

aug:
  window: {mode: random, mix: tissue}
  noise: {p: 0.5, sigma: [0.02, 0.15]}
  blur: {p: 0.3, sigma_vox: [0.5, 1.5]}
  drift: {p: 0.3, amp: 0.25}

loss:
  lamb: 0.02
  win_weight: 1.0
  local_pooled: false
  n_proj: 256
  gather_ddp: true
  dense: {weight: 1.0, tokens_per_view: 4, stopgrad_mean: true}
  predict: {weight: 1.0, pixel_weight: 0.5, pixel_cells: [2, 2, 2], blocks: 4, block_tokens: [4, 7], depth: 4, ramp_steps: 1000}

optim:
  lr: 0.00025
  weight_decay: 0.05
  warmup_steps: 1000
  clip_grad: 1.0
  batch_size: 96

train:
  max_steps: 15000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 3000

output:
  out_dir: runs/brainmodel_small_harder
  init_from: runs/brainmodel_small_fomo/last.pt

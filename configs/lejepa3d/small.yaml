# 3D LeJEPA small: the tiny dense native-grid recipe, scaled the way 2D small was.
#
# Encoder is ViT-S/16 (dim 384, 6 heads, 12 blocks) instead of tiny (192 / 3 / 12).
# Per-GPU batch is halved (96 vs 192) so activations fit an L40S; lr is linearly
# scaled from tiny's 5e-4. No masked-prediction head: it did not move Dice on tiny.
# Masked prediction is on (context term + 2x2x2 cell-mean local term), as on tiny predict_8k:
# it raised lesion-lift MLP and position R2; it did not change Dice. Score later at 8x8x4.
#
# Crops lie on the volume's own token grid, so crops that overlap share tokens exactly.

seed: 42

data:
  store_root: /home/roku/orcd/scratch/brain-model/data/processed/slices_zarr
  index_name: volumes.csv
  default_spacing_mm: [1.0, 1.0, 1.0]
  default_origin_mm: [0.0, 0.0, 0.0]
  volume_size_xyz: [256, 256, 160]
  num_workers: 10
  balance_alpha: 0.5
  # BraTS cohorts are one source: they share one group's mass instead of each counting as a family (with GoAT they
  # took 29% of samples alone). Group mass ~ n_group^alpha, split among its families by n_family^alpha.
  balance_groups:
    brats: [brats_gli, brats_men, brats_ped, brats_goat]

model:
  size: small
  in_chans: 1
  proj_dim: 128
  proj_hidden: 2048
  qk_norm: true
  rope_base_mm: 100.0
  checkpoint: true
  proj_norm: batch
  length_buckets: 4
  dense_dim: 128
  dense_hidden: 1024

views:
  patch_xyz: [16, 16, 8]
  global: {n: 2, size_xyz: [128, 128, 64]}
  local: {n: 2, size_xyz: [64, 64, 32]}
  fine: {n: 2, size_xyz: [32, 32, 16], patch_xyz: [8, 8, 4]}
  nested: true
  fg_min: 0.15
  retries: 8
  gate: {ct_hu: [-500.0, 200.0], mri_lo: -5.5}

aug:
  # Skull dropout per view: each view independently is cut to its (QC-passed) brain mask, so skull-on and skull-free
  # views of one scan meet in the invariance terms. Skull-stripped releases are ~28% of samples after balancing, so
  # p=0.3 makes ~49% of all views skull-free.
  skull: {p: 0.3, per_view: true}
  # Geometric augmentation, independently per view (rotated / scaled / flipped about the crop center, sampled on the
  # GPU from the whole volume). Ranges follow real head positioning and size: pitch (about the left-right axis) up to
  # +-15 deg, roll and yaw +-10 deg (rot_deg is about the z, y, x axes), isotropic scale +-15%, left-right mirror.
  # Tokens are matched across views by where their centers land in the scan, so the dense terms compare the same
  # anatomy; RoPE stays on each view's own regular grid (relative positions, true voxel size). Validation is off.
  geometric: {p: 0.8, rot_deg: [10, 10, 15], scale: [0.85, 1.15], flip_lr: 0.5}
  window: {mode: random, mix: brain_bone}       # "brain" + 3% bone window (CT), which frozen eval also uses
  # MRI: Rician noise in native units (magnitude of signal + complex Gaussian noise; SNR = tissue / sigma, log-uniform).
  # CT: Gaussian noise in windowed units (sigma).
  noise: {p: 0.5, kind: rician, snr: [15, 100], sigma: [0.02, 0.15]}
  # MRI only: borrow another same-contrast scan's tissue histogram (blended), so scanner contrast is not a cheap cue.
  # Never CT (HU are physical).
  histmatch: {p: 0.10, alpha: [0.3, 0.7]}   # 32 whole-volume quantiles (volumes.HIST_LEVELS)
  # Contrast curve relaxed and never inverted: the v3 diagnosis showed the encoder discarding tissue contrast that
  # carries biology (myelination, WMH, MS lesions). Gentler, rarer re-rendering keeps cross-scanner robustness.
  curve: {p: 0.5, knots: 5, strength: 0.3, flip: 0.0}
  blur: {p: 0.3, sigma_vox: [0.5, 1.5]}
  drift: {p: 0.3, amp: 0.25}

loss:
  lamb: 0.03
  win_weight: 1.0
  local_pooled: false
  n_proj: 256
  gather_ddp: true
  dense: {weight: 1.0, tokens_per_view: 32}
  predict: {weight: 1.0, pixel_weight: 0.5, pixel_cells: [2, 2, 2], blocks: 3, block_tokens: [3, 6], depth: 4, ramp_steps: 2000}

optim:
  lr: 0.00025
  weight_decay: 0.05
  warmup_steps: 2000
  clip_grad: 1.0
  batch_size: 96

train:
  max_steps: 30000
  log_every: 50
  eval_every: 1000
  ckpt_every: 500
  keep_every: 3000

output:
  out_dir: runs/brainmodel_small_fomo
